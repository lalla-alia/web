<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تعريف مطالع تموز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root{
  --bg:#000; --surface:#111118; --accent:#1a2a3a;
  --text:#fff; --text2:#a0a0b0; --blue:#4e6bff; --cyan:#6bd3ff;
  --nav-h:78px; --pad:20px;
}
html,body{ background:#000; height:100dvh; width:100%; overflow:hidden; direction:rtl; }
body{ font-family:'Tajawal',sans-serif; color:var(--text); display:flex; flex-direction:column; }

/* ═══ حاوية الأقسام ═══ */
#app{ flex:1; min-height:0; position:relative; overflow:hidden; }
.view{ position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .28s ease; }
.view.active{ opacity:1; pointer-events:auto; }

/* ═══ الكاروسيل (تمرير — صفحة واحدة بالضبط مهما كانت قوة التمرير) ═══ */
.carousel{ height:100%; width:100%; overflow:hidden; touch-action:none; cursor:grab; direction:ltr; }
.carousel:active{ cursor:grabbing; }
.track{ height:100%; display:flex; will-change:transform; }
.slide{
  flex:0 0 100%; width:100%; height:100%;
  overflow-y:auto; overflow-x:hidden; scrollbar-width:none;
  direction:rtl;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
.slide::-webkit-scrollbar{ display:none; }

/* ── محتوى صفحات شرح اللعبة ── */
.gh-slide{ padding:26px var(--pad) 130px; }
.gh-h1{ font-size:1.4rem; font-weight:900; margin-bottom:14px; }
.gh-h2{ font-size:1.05rem; font-weight:800; color:var(--cyan); margin:22px 0 10px; }
.gh-p{ font-size:.9rem; line-height:1.95; color:var(--text2); margin-bottom:14px; }
.gh-p.emph{ color:var(--text); font-weight:700; }
.gh-list{ list-style:none; margin-bottom:14px; display:flex; flex-direction:column; gap:9px; }
.gh-li{ display:flex; align-items:flex-start; gap:10px; }
.gh-li::before{
  content:''; width:6px; height:6px; margin-top:8px; border-radius:50%;
  background:var(--cyan); flex-shrink:0;
}
.gh-li-text{ font-size:.88rem; line-height:1.85; color:var(--text2); flex:1; min-width:0; }
.gh-li-row{ display:flex; align-items:center; gap:10px; width:100%; }
.gh-p-inline{ flex:1; min-width:0; margin-bottom:0; }

/* صورة كاملة العرض (^) — تمتد حافة إلى حافة الشاشة، خارج الحشو */
.blk-full{
  width:calc(100% + var(--pad)*2); margin:16px calc(var(--pad)*-1) 20px;
  aspect-ratio:16/9; overflow:hidden; position:relative;
  border-top:1px solid rgba(255,255,255,.08); border-bottom:1px solid rgba(255,255,255,.08);
}
.blk-full img{ width:100%; height:100%; object-fit:cover; display:block; }
.slide img{ -webkit-user-drag:none; -webkit-touch-callout:none; user-select:none; pointer-events:none; }

/* صورة مصاحبة للنص (©) — صغيرة، بجانب النص مباشرة، بحجم موحّد ومحاذاة مضبوطة */
.inline-group{ display:flex; align-items:center; gap:6px; flex-shrink:0; align-self:center; }
.blk-inline{
  width:42px; height:42px; border-radius:10px; overflow:hidden; flex-shrink:0;
  border:1px solid rgba(255,255,255,.14); background:var(--surface);
}
.blk-inline img{ width:100%; height:100%; object-fit:cover; display:block; }

/* عنصر عنصر بديل عند عدم توفر الصورة */
.ph-box{
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(155deg,var(--surface),#0a0a10); color:rgba(255,255,255,.18);
}
.ph-box.full i{ font-size:2.2rem; }
.ph-box.inline i{ font-size:1.1rem; }

/* ═══ صفحات شرح الشخصيات (معدلة) ═══ */
.ch-slide{ 
  padding:0 0 130px; 
  position:relative; 
  display:flex; 
  flex-direction:column; 
  height:100%; 
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:none;
}
.ch-slide::-webkit-scrollbar{ display:none; }

.ch-name-top {
  text-align:center; 
  font-size:1.2rem; 
  font-weight:900; 
  color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.6);
  padding:14px 0 4px;
  position:relative;
  z-index:2;
  flex-shrink:0;
}

/* ── الصف العلوي: الصورة بجانب النص (ارتفاع ثابت لا يتغيّر) ── */
.ch-top-row {
  flex:0 0 auto;
  display:flex;
  align-items:stretch;
  gap:14px;
  padding:6px var(--pad) 4px;
  height:clamp(260px, 48vh, 420px);
}

/* ── حاوية الصورة: حجم ثابت دائمًا، أي تجاوز من الصورة يُقص تلقائيًا ── */
.ch-portrait-wrap {
  flex:0 0 48%;
  width:48%;
  max-width:48%;
  height:100%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.ch-portrait {
  position:relative; 
  width:100%;
  height:100%;
  overflow:hidden;
}

.ch-portrait::after {
  content:'';
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:linear-gradient(to bottom,
    rgba(0,0,0,0) 55%,
    rgba(0,0,0,.35) 78%,
    var(--bg) 100%
  );
}

.ch-portrait img {
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:top center;
  display:block;
  transform:scale(1.3334);
  transform-origin:top center;
}

.ch-portrait i {
  position:absolute; 
  inset:0; 
  display:flex; 
  align-items:center; 
  justify-content:center; 
  font-size:3.4rem; 
  color:var(--char-col,var(--cyan)); 
  opacity:.55;
}

/* ── النص الجانبي: صندوق مستقل بنفس ارتفاع الصورة، يُمرَّر داخليًا عند الفيض ── */
.ch-side-text {
  flex:1;
  min-width:0;
  height:100%;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:none;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding-top:2px;
}
.ch-side-text::-webkit-scrollbar{ display:none; }

/* ── معلومات الشخصية: مكتوبة فوق الصورة، أعلى يمينها، بدون خلفية ── */
.ch-stats {
  position:absolute;
  top:10px;
  right:10px;
  z-index:3;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:4px;
  pointer-events:none;
}
.ch-stat-row{ display:flex; align-items:baseline; gap:5px; font-size:.72rem; line-height:1.4; text-shadow:0 1px 5px rgba(0,0,0,.85), 0 0 12px rgba(0,0,0,.6); }
.ch-stat-label{ color:var(--char-col,var(--cyan)); font-weight:800; flex-shrink:0; }
.ch-stat-value{ color:#fff; font-weight:600; word-break:break-word; }

/* ── وصف الشخصية ── */
.ch-desc-wrap {
  padding:14px var(--pad) 20px;
  flex-shrink:0;
}
.ch-side-text .ch-desc{
  font-size:.8rem;
  line-height:1.75;
}
.ch-desc{ 
  font-size:.9rem; 
  line-height:1.95; 
  color:var(--text2); 
  margin:0 0 14px;
}
.ch-desc:last-child{ margin-bottom:0; }

/* ── عناوين فرعية صغيرة تفصل الأقسام (نبذة / المهمة) ── */
.ch-section-label{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:.72rem;
  font-weight:800;
  letter-spacing:.3px;
  color:var(--char-col,var(--cyan));
  margin-bottom:8px;
}
.ch-section-label i{ font-size:.68rem; }
.ch-section-label::after{
  content:'';
  flex:1;
  height:1px;
  background:linear-gradient(to left, rgba(255,255,255,.14), transparent);
}

/* ── تمييز الكلمات والعبارات المهمة داخل النص ── */
.hl{
  color:#fff;
  font-weight:800;
}
.hl-accent{
  color:var(--char-col,var(--cyan));
  font-weight:800;
}

/* ── قسم المهمة / القدرة (يفصله خط عن السيرة) ── */
.ch-ability-wrap{
  margin-top:6px;
  padding-top:16px;
  border-top:1px solid rgba(255,255,255,.08);
}
.ch-ability-wrap .ch-desc{ color:var(--text2); }

/* ═══ النقاط (Dots) ═══ */
.dots{ display:none; align-items:center; justify-content:center; gap:8px; height:14px; }
.dots.active{ display:flex; }
.dot{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.22); transition:all .25s ease; cursor:pointer; }
.dot.active{ width:20px; border-radius:5px; background:var(--cyan); }

/* ═══ زر تصفية الفرق — بدون خلفية، داخل القائمة السفلية ═══ */
.ch-filter-btn{
  position:absolute;
  right:18px;
  top:14px;
  z-index:2;
  width:auto;
  height:auto;
  border:none;
  background:none;
  color:var(--text-dim);
  opacity:.6;
  display:none;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:1.05rem;
  padding:8px;
  transition:color .2s ease, opacity .2s ease;
}
.ch-filter-btn.shown{ display:flex; }
.ch-filter-btn i{ transition:transform .25s ease; }
.ch-filter-btn.open i{ transform:rotate(180deg); }
.ch-filter-btn.filtered{ color:var(--cyan); opacity:1; }
.ch-filter-btn:hover{ opacity:1; }

.ch-filter-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
  z-index:11;
}
.ch-filter-backdrop.open{ opacity:1; pointer-events:auto; }

/* قائمة عمودية ملتصقة بيمين الشاشة، فوق القائمة السفلية مباشرة */
.ch-filter-sheet{
  position:fixed;
  right:0;
  bottom:0;
  z-index:12;
  display:flex;
  flex-direction:column;
  min-width:150px;
  background:linear-gradient(0deg,rgba(0,0,0,.98) 60%,rgba(0,0,0,.7) 100%);
  border:1px solid rgba(255,255,255,.08);
  border-bottom:none;
  border-radius:0;
  padding:6px 0 10px;
  transform:translateY(12px);
  opacity:0;
  pointer-events:none;
  transition:transform .25s cubic-bezier(.22,.61,.36,1), opacity .2s ease, bottom .15s ease;
}
.ch-filter-sheet.open{ transform:translateY(0); opacity:1; pointer-events:auto; }
.ch-filter-options{
  display:flex;
  flex-direction:column;
}
.ch-filter-opt{
  background:none;
  border:none;
  border-top:1px solid rgba(255,255,255,.09);
  padding:12px 22px;
  color:var(--text2);
  font-size:.82rem;
  font-weight:700;
  text-align:center;
  cursor:pointer;
  transition:color .2s ease;
}
.ch-filter-options .ch-filter-opt:first-child{ border-top:none; }
.ch-filter-opt.active{ color:var(--cyan); }

/* ═══ القائمة السفلية ═══ */
nav#bottom-nav{
  flex-shrink:0; display:flex; flex-direction:column; align-items:center;
  gap:10px; padding:12px 0 14px;
  background:linear-gradient(0deg,rgba(0,0,0,.98) 60%,rgba(0,0,0,.7) 100%);
  border-top:1px solid rgba(255,255,255,.08);
  position:relative; z-index:10;
}
.nav-icons{ display:flex; align-items:center; justify-content:center; gap:56px; }
.nav-btn{ background:none; border:none; color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:8px 14px; }
.nav-svg{
  width:1.55rem; height:1.55rem; display:block; fill:none; stroke:currentColor;
  stroke-linecap:round; stroke-linejoin:round; stroke-width:1.7; opacity:.5;
  transition:opacity .15s ease, stroke-width .15s ease, transform .15s ease;
}
.nav-btn.active .nav-svg{ opacity:1; stroke-width:2.1; color:var(--cyan); transform:scale(1.08); }

/* ── تحسينات للشاشات الصغيرة ── */
@media (max-width: 480px) {
  .ch-top-row { gap:10px; height:clamp(240px, 46vh, 380px); }
  .ch-name-top { font-size:1rem; padding:10px 0 2px; }
  .ch-desc { font-size:.82rem; }
  .ch-side-text .ch-desc { font-size:.75rem; line-height:1.65; }
  .ch-stat-row { font-size:.7rem; }
}

@media (min-width: 768px) {
  .ch-top-row { height:clamp(340px, 54vh, 500px); }
}

@media (min-width: 1024px) {
  .ch-top-row { height:clamp(380px, 58vh, 560px); }
}
</style>
</head>
<body>

<div id="app">

  <!-- ═══ شرح اللعبة ═══ -->
  <section class="view active" id="view-game">
    <div class="carousel" id="carousel-game"><div class="track" id="track-game"></div></div>
  </section>

  <!-- ═══ شرح الشخصيات ═══ -->
  <section class="view" id="view-chars">
    <div class="carousel" id="carousel-chars"><div class="track" id="track-chars"></div></div>
  </section>

  <div class="ch-filter-backdrop" id="ch-filter-backdrop"></div>
  <div class="ch-filter-sheet" id="ch-filter-sheet">
    <div class="ch-filter-options" id="ch-filter-options"></div>
  </div>

</div>

<!-- ═══ القائمة السفلية ═══ -->
<nav id="bottom-nav">
  <div class="nav-icons">
    <button class="nav-btn active" id="btn-game" onclick="switchView('game')">
      <svg class="nav-svg" viewBox="0 0 24 24">
        <rect x="3" y="8" width="18" height="9.5" rx="4.5"/>
        <line x1="7.2" y1="12" x2="7.2" y2="15.5"/>
        <line x1="5.4" y1="13.75" x2="9" y2="13.75"/>
        <circle cx="15" cy="12.6" r="1" fill="currentColor" stroke="none"/>
        <circle cx="17.3" cy="14.8" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button class="nav-btn" id="btn-chars" onclick="switchView('chars')">
      <svg class="nav-svg" viewBox="0 0 24 24">
        <circle cx="9" cy="8" r="3.3"/>
        <path d="M3.5 19c0-3.3 2.5-5.5 5.5-5.5s5.5 2.2 5.5 5.5"/>
        <circle cx="17" cy="8.5" r="2.6" opacity=".7"/>
        <path d="M16 13.6c2.4.3 4 2.2 4 5"/>
      </svg>
    </button>
  </div>
  <div class="dots active" id="dots-game"></div>
  <div class="dots" id="dots-chars"></div>
  <button class="ch-filter-btn" id="ch-filter-btn" aria-label="تصفية حسب الفريق">
    <i class="fas fa-chevron-up"></i>
  </button>
</nav>

<script type="module">
(async () => {

/* ══════════════════════════════════════════
   أداة استبدال الصور المكسورة بعنصر بديل
════════════════════════════════════════════ */
window.imgOrPH = function(imgEl, kind) {
  const ph = document.createElement('div');
  ph.className = 'ph-box ' + kind;
  ph.innerHTML = '<i class="fas fa-image"></i>';
  imgEl.replaceWith(ph);
};

function fullImg(src) {
  return `<div class="blk-full"><img src="${src}" alt="" onerror="imgOrPH(this,'full')"></div>`;
}
function inlineImgs(srcs) {
  return `<div class="inline-group">` + srcs.map(s =>
    `<div class="blk-inline"><img src="${s}" alt="" onerror="imgOrPH(this,'inline')"></div>`
  ).join('') + `</div>`;
}

/* ══════════════════════════════════════════
   محتوى صفحات شرح اللعبة (5 صفحات)
   بُنية كل صفحة: مصفوفة "بلوكات" تُترجم لعناصر HTML
════════════════════════════════════════════ */
function renderBlocks(blocks, pageIdx) {
  let n = 0;
  const img = () => `assets/tutorial/p${pageIdx}-${++n}.png`;
  let html = '';
  blocks.forEach(b => {
    if (b.type === 'h') {
      html += `<h2 class="gh-h1">${b.text}</h2>`;
      if (b.imgBelow) html += fullImg(img());
    } else if (b.type === 'h3') {
      html += `<h3 class="gh-h2">${b.text}</h3>`;
      if (b.imgBelow) html += fullImg(img());
    } else if (b.type === 'p') {
      if (b.inlineCount) {
        html += `<div class="gh-li-row" style="margin-bottom:14px;">
          <p class="gh-p gh-p-inline">${b.text}</p>
          ${inlineImgs(Array.from({length:b.inlineCount}, img))}
        </div>`;
      } else {
        html += `<p class="gh-p ${b.emphasis?'emph':''}">${b.text}</p>`;
      }
    } else if (b.type === 'list') {
      html += `<ul class="gh-list">` + b.items.map(it => {
        const item = typeof it === 'string' ? { text: it } : it;
        let row = `<li class="gh-li"><div class="gh-li-row">
          <span class="gh-li-text">${item.text}</span>
          ${item.inlineCount ? inlineImgs(Array.from({length:item.inlineCount}, img)) : ''}
        </div></li>`;
        if (item.imgBelow) row += fullImg(img());
        return row;
      }).join('') + `</ul>`;
    }
  });
  return html;
}

const GAME_PAGES = [
  // ── الصفحة 1: مرحبًا بك ──
  { imgBelow:true, blocks:[
    { type:'h', text:'مرحبًا بك!', imgBelow:true },
    { type:'p', text:'مرحبًا بك في اللعبة! هذه لعبة استراتيجية جماعية تعتمد على التفكير المنطقي، وتحليل الأدلة، والتخطيط، والعمل الجماعي. في كل مباراة ينضم 8 لاعبين، ويُوزَّع عليهم عدد من الوظائف المختلفة بشكل عشوائي، حيث ينتمي كل لاعب إلى فريق محدد يمتلك أهدافًا تختلف عن أهداف الفرق الأخرى.' },
    { type:'p', text:'لكل شخصية وظيفة فريدة، ومهارات خاصة، ودور مهم يؤثر بشكل مباشر على مجريات المباراة. بعض الشخصيات تعمل على حماية السيرفرات وكشف المخربين، بينما تسعى شخصيات أخرى إلى تنفيذ عمليات الاختراق أو تضليل اللاعبين لتحقيق أهداف فريقها.' },
    { type:'p', text:'لتحقيق الفوز، لن يكفي الاعتماد على الحظ، بل ستحتاج إلى:' },
    { type:'list', items:[
      'تحليل أحداث كل ليلة بدقة.',
      'مراقبة تصرفات اللاعبين واستنتاج نواياهم.',
      'التعاون مع أعضاء فريقك ومشاركة المعلومات المهمة.',
      'اتخاذ قرارات مدروسة أثناء التصويت.',
      'استخدام مهارات شخصيتك في الوقت المناسب.'
    ]},
    { type:'p', text:'تذكّر أن المظاهر قد تكون خادعة؛ فقد يبدو اللاعب بريئًا وهو يخفي دوره الحقيقي، وقد يُتهم لاعب بريء بسبب أدلة مضللة أو استنتاجات خاطئة. لذلك، فكّر جيدًا قبل اتخاذ أي قرار، فكل اختيار تقوم به قد يغيّر مجرى المباراة بالكامل.' },
    { type:'p', emphasis:true, text:'هل أنت مستعد لاكتشاف الحقيقة، أم ستكون أنت من ينجح في خداع الجميع؟' },
  ]},

  // ── الصفحة 2: مرحلة الليل ──
  { blocks:[
    { type:'h', text:'مرحلة الليل', imgBelow:true },
    { type:'p', text:'تستمر مرحلة الليل لمدة 30 ثانية، وهي المرحلة التي ينفذ فيها كل لاعب الإجراءات والمهام الخاصة بوظيفته بسرية تامة. خلال هذه الفترة، يمكنك استخدام مهاراتك، مراقبة حالة السيرفرات، وتسجيل أي معلومات قد تساعدك في المراحل القادمة، لذلك يُنصح باستغلال الوقت وعدم الانتظار حتى الثواني الأخيرة.' },
    { type:'h3', text:'قائمة الإجراءات' },

let supabase;

  const mod = await import('../database/config.js');
  supabase = mod.supabase;
} catch (e) {
  supabase = { from: () => ({ select: () => Promise.resolve({ data: null }) }) };
}

async function loadCharactersFromDB() {
  const map = {};
  try {
    const { data, error } = await supabase.from('characters').select('*');
    if (error) throw error;
    (data || []).forEach(row => {
      map[row.id] = {
        name: row.name || '',
        icon: row.icon || '',
      };
    });
  } catch (e) {
    console.error('[help] فشل تحميل characters:', e.message);
  }
  return map;
}

// ── دمج بيانات الجدول (اسم/صورة فقط) فوق النصوص المحلية ──
// اللون يبقى محليًا لأنه مرتبط بالفريق (اسبيتا = أحمر، كولم = أبيض)
CHARACTERS.forEach(ch => {
  const db = _dbChars[ch.id];
  if (!db) return;
  if (db.name) ch.name = db.name;
  if (db.icon) ch.img  = db.icon;
});

function statsCard(stats) {
  if (!stats) return '';
  const rows = [
    stats.kunya  ? { label:'الكنية',  value:stats.kunya  } : null,
    stats.height ? { label:'الطول',   value:stats.height } : null,
    stats.team   ? { label:'الفريق',  value:stats.team   } : null,
  ].filter(Boolean);
  if (!rows.length) return '';
  return `<div class="ch-stats">${rows.map(r =>
    `<div class="ch-stat-row"><span class="ch-stat-label">${r.label}:</span><span class="ch-stat-value">${r.value}</span></div>`
  ).join('')}</div>`;
}
function paragraphs(text) {
  if (!text) return '';
  const arr = Array.isArray(text) ? text : [text];
  return arr.map(p => `<p class="ch-desc">${p}</p>`).join('');
}

function renderCharSlide(ch, i) {
  return `
  <div class="slide ch-slide" data-i="${i}" style="--char-col:${ch.color};">
    <div class="ch-name-top">${ch.enName || ch.id}</div>
    <div class="ch-top-row">
      <div class="ch-portrait-wrap">
        <div class="ch-portrait">
          ${ch.img
            ? `<img src="${ch.img}" alt="" onerror="imgOrPH(this,'full')">`
            : `<i class="fas fa-user"></i>`}
          ${statsCard(ch.stats)}
        </div>
      </div>
      <div class="ch-side-text">
        ${ch.bio ? `<div class="ch-section-label"><i class="fas fa-user"></i>نبذة</div>` : ''}
        ${paragraphs(ch.bio || ch.desc)}
      </div>
    </div>
    ${ch.ability ? `<div class="ch-desc-wrap"><div class="ch-ability-wrap"><div class="ch-section-label"><i class="fas fa-bolt"></i>المهمة والقدرة</div>${paragraphs(ch.ability)}</div></div>` : ''}
  </div>
`;
}

const trackChars = document.getElementById('track-chars');
let visibleCharacters = CHARACTERS;
function renderCharacters(list) {
  visibleCharacters = list;
  trackChars.innerHTML = list.map((ch, i) => renderCharSlide(ch, i)).join('');
}
renderCharacters(CHARACTERS);

/* ══════════════════════════════════════════
   محرّك الكاروسيل: Pointer Events بالكامل
   (تعمل مع اللمس والفأرة معًا)، والتحكم يدويًا
   بمحوري الأفقي (تبديل صفحة) والعمودي (تمرير
   محتوى الصفحة) لتفادي تعارض السحب مع التمرير
   الأصلي للمتصفح. صفحة واحدة بالضبط دائمًا،
   بغض النظر عن قوة أو سرعة السحب.
════════════════════════════════════════════ */
function makePager(viewportId, trackId, dotsId, initialCount) {
  const viewport = document.getElementById(viewportId);
  const track = document.getElementById(trackId);
  const dotsWrap = document.getElementById(dotsId);
  let count = initialCount;
  let index = 0;
  let viewportW = viewport.clientWidth;
  let startX = 0, startY = 0, curX = 0, curY = 0;
  let axis = null, dragging = false;
  let activeSlide = null, slideStartScroll = 0;
  let velY = 0, lastY = 0, lastT = 0, momentumId = null;

  function stopMomentum() {
    if (momentumId) { cancelAnimationFrame(momentumId); momentumId = null; }
  }
  function runMomentum(slide) {
    if (Math.abs(velY) < 0.02 || !slide) { momentumId = null; return; }
    const max = slide.scrollHeight - slide.clientHeight;
    let next = slide.scrollTop - velY * 16;
    if (next <= 0 || next >= max) { velY = 0; slide.scrollTop = Math.max(0, Math.min(max, next)); momentumId = null; return; }
    slide.scrollTop = next;
    velY *= 0.94;
    momentumId = requestAnimationFrame(() => runMomentum(slide));
  }

  let dots = [];
  function buildDots() {
    dotsWrap.innerHTML = Array.from({length:count}, (_,i) =>
      `<div class="dot ${i===0?'active':''}" data-i="${i}"></div>`).join('');
    dots = [...dotsWrap.children];
    dots.forEach(d => d.addEventListener('click', () => goTo(+d.dataset.i)));
  }
  buildDots();

  function setTransform(px, animate) {
    track.style.transition = animate ? 'transform .32s cubic-bezier(.22,.61,.36,1)' : 'none';
    track.style.transform = `translateX(${px}px)`;
  }
  function updateDots() {
    dots.forEach((d, i) => d.classList.toggle('active', i === index));
  }
  function goTo(i, animate = true) {
    index = Math.max(0, Math.min(count - 1, i));
    viewportW = viewport.clientWidth;
    setTransform(-index * viewportW, animate);
    updateDots();
  }
  function rebuildDots(newCount) {
    count = Math.max(newCount, 0);
    buildDots();
    goTo(0, false);
  }

  function getXY(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  function onStart(e) {
    if (e.type === 'mousedown' && e.button !== 0) return;
    stopMomentum();
    dragging = true; axis = null;
    const p = getXY(e);
    startX = curX = p.x; startY = curY = p.y;
    viewportW = viewport.clientWidth;
    activeSlide = e.target.closest('.ch-side-text, .slide');
    slideStartScroll = activeSlide ? activeSlide.scrollTop : 0;
    velY = 0; lastY = p.y; lastT = performance.now();
    setTransform(-index * viewportW, false);
    document.body.style.userSelect = 'none';
  }

  function onMove(e) {
    if (!dragging) return;
    const p = getXY(e);
    curX = p.x; curY = p.y;
    const dx = curX - startX, dy = curY - startY;
    if (axis === null) {
      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
        axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      }
    }
    if (axis === 'x') {
      if (e.cancelable) e.preventDefault();
      let delta = dx;
      if ((index === 0 && delta > 0) || (index === count - 1 && delta < 0)) delta *= .35;
      setTransform(-index * viewportW + delta, false);
    } else if (axis === 'y' && activeSlide) {
      if (e.cancelable) e.preventDefault();
      activeSlide.scrollTop = slideStartScroll - dy;
      const now = performance.now();
      const dt = now - lastT;
      if (dt > 0) { velY = (p.y - lastY) / dt; lastY = p.y; lastT = now; }
    }
  }

  function onEnd() {
    if (!dragging) return;
    dragging = false;
    if (axis === 'x') {
      const delta = curX - startX;
      const threshold = viewportW * 0.15;
      if (delta < -threshold) goTo(index + 1);
      else if (delta > threshold) goTo(index - 1);
      else goTo(index);
    }
    if (axis === 'y' && activeSlide) runMomentum(activeSlide);
    axis = null; activeSlide = null;
    document.body.style.userSelect = '';
  }

  viewport.addEventListener('touchstart', onStart, { passive:true });
  viewport.addEventListener('touchmove', onMove, { passive:false });
  viewport.addEventListener('touchend', onEnd);
  viewport.addEventListener('touchcancel', onEnd);
  viewport.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);

  window.addEventListener('resize', () => goTo(index, false));
  goTo(0, false);
  return { goTo, rebuildDots };
}

const gamePager = makePager('carousel-game', 'track-game', 'dots-game', GAME_PAGES.length);
const charsPager = makePager('carousel-chars', 'track-chars', 'dots-chars', CHARACTERS.length);

/* ══════════════════════════════════════════
   تصفية الشخصيات حسب الفريق (الزر السفلي ^)
════════════════════════════════════════════ */
(function initCharFilter() {
  const btn = document.getElementById('ch-filter-btn');
  const sheet = document.getElementById('ch-filter-sheet');
  const backdrop = document.getElementById('ch-filter-backdrop');
  const optsWrap = document.getElementById('ch-filter-options');
  const nav = document.getElementById('bottom-nav');
  if (!btn || !sheet || !backdrop || !optsWrap) return;

  function positionAboveNav() {
    if (nav) sheet.style.bottom = nav.offsetHeight + 'px';
  }
  positionAboveNav();
  window.addEventListener('resize', positionAboveNav);

  const teams = [];
  CHARACTERS.forEach(ch => {
    const t = ch.stats && ch.stats.team;
    if (t && !teams.includes(t)) teams.push(t);
  });
  const options = ['الجميع', ...teams];
  let activeTeam = 'الجميع';

  optsWrap.innerHTML = options.map(t =>
    `<button class="ch-filter-opt ${t===activeTeam?'active':''}" data-team="${t}">${t}</button>`
  ).join('');

  function applyFilter(team) {
    activeTeam = team;
    [...optsWrap.children].forEach(b => b.classList.toggle('active', b.dataset.team === team));
    btn.classList.toggle('filtered', team !== 'الجميع');
    const list = team === 'الجميع'
      ? CHARACTERS
      : CHARACTERS.filter(ch => ch.stats && ch.stats.team === team);
    renderCharacters(list);
    charsPager.rebuildDots(list.length);
  }

  function openSheet() {
    sheet.classList.add('open');
    backdrop.classList.add('open');
    btn.classList.add('open');
  }
  function closeSheet() {
    sheet.classList.remove('open');
    backdrop.classList.remove('open');
    btn.classList.remove('open');
  }

  btn.addEventListener('click', () => {
    sheet.classList.contains('open') ? closeSheet() : openSheet();
  });
  backdrop.addEventListener('click', closeSheet);
  optsWrap.addEventListener('click', (e) => {
    const b = e.target.closest('.ch-filter-opt');
    if (!b) return;
    applyFilter(b.dataset.team);
    closeSheet();
  });
  window.closeCharFilterSheet = closeSheet;
})();

/* ══════════════════════════════════════════
   التبديل بين شرح اللعبة وشرح الشخصيات
════════════════════════════════════════════ */
window.switchView = function(name) {
  document.getElementById('view-game').classList.toggle('active', name==='game');
  document.getElementById('view-chars').classList.toggle('active', name==='chars');
  document.getElementById('btn-game').classList.toggle('active', name==='game');
  document.getElementById('btn-chars').classList.toggle('active', name==='chars');
  document.getElementById('dots-game').classList.toggle('active', name==='game');
  document.getElementById('dots-chars').classList.toggle('active', name==='chars');
  document.getElementById('ch-filter-btn').classList.toggle('shown', name==='chars');
  if (name !== 'chars' && window.closeCharFilterSheet) window.closeCharFilterSheet();
};

// تلقائيًا: يفتح شرح اللعبة عند التشغيل
switchView('game');

})();
</script>
